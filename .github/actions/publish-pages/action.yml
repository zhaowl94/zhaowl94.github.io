name: Publish GitHub Pages
description: Upload the site, wait for the artifact to be listed, and deploy it.
outputs:
  page_url:
    description: URL of the published site.
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      with:
        enablement: true

    - name: Upload site
      id: upload
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        name: github-pages-${{ github.run_attempt }}
        path: .

    - name: Wait for Pages artifact to be listed
      uses: ./.github/actions/publish-pages/wait-for-artifact
      with:
        artifact_id: ${{ steps.upload.outputs.artifact_id }}

    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
