name: Publish GitHub Pages
description: Upload the site and deploy it by artifact ID.
outputs:
  page_url:
    description: URL of the published site.
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      with:
        enablement: true

    - name: Upload site
      id: upload
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        name: github-pages-${{ github.run_attempt }}
        path: .

    - name: Deploy Pages by artifact ID
      id: deployment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
      with:
        script: |
          const { deployPages } = require('./.github/actions/publish-pages/deploy.mjs');
          await deployPages({ github, core, context, artifactId: process.env.PAGES_ARTIFACT_ID });
