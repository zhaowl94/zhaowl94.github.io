name: Refresh Market Pulse

on:
  schedule:
    # Covers regular US trading hours in both daylight and standard time.
    # Offset minutes reduce contention around the top of the hour.
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    name: Build deterministic snapshot and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore latest Market Pulse snapshot and private build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            market-pulse/data/state.json
            ${{ runner.temp }}/market-pulse-cache
          key: market-pulse-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-pulse-data-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install snapshot dependency
        run: python -m pip install "requests>=2.31,<3.0"

      - name: Refresh no-LLM Market Pulse snapshot
        run: >-
          python scripts/update-market-pulse-data.py
          --cache-dir "${{ runner.temp }}/market-pulse-cache"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Update home-page status and validate all snapshots
        run: |
          node scripts/update-tool-status.mjs
          node scripts/validate-site-data.mjs

      - name: Save latest Market Pulse snapshot and private build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            market-pulse/data/state.json
            ${{ runner.temp }}/market-pulse-cache
          key: market-pulse-data-${{ runner.os }}-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
