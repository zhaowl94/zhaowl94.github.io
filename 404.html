<!doctype html>
<html class="no-js" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#121210" />
    <meta name="robots" content="noindex, follow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="页面不存在。返回 zhaowl94 的开源工程作品集。"
      data-meta-zh="页面不存在。返回 zhaowl94 的开源工程作品集。"
      data-meta-en="Page not found. Return to zhaowl94's open-source engineering portfolio."
    />
    <title
      data-title-zh="页面不存在 · zhaowl94"
      data-title-en="Page not found · zhaowl94"
    >
      页面不存在 · zhaowl94
    </title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles/site.css" />
    <script src="assets/scripts/site.js" defer></script>
    <noscript>
      <style>
        [data-lang-content][hidden] {
          display: revert !important;
        }

        .language-switch {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="error-page">
    <a class="skip-link" href="#main-content">
      <span data-lang-content="zh">跳到主要内容</span>
      <span data-lang-content="en" lang="en" hidden>Skip to main content</span>
    </a>
    <header class="site-header">
      <div class="shell header-layout">
        <a class="wordmark" href="./index.html">
          <span class="wordmark-mark" aria-hidden="true"></span>
          <span>zhaowl94</span>
        </a>
        <nav class="language-switch" aria-label="语言选择">
          <a href="?lang=zh" data-language-link="zh" lang="zh-CN">中</a>
          <span aria-hidden="true">/</span>
          <a href="?lang=en" data-language-link="en" lang="en">EN</a>
        </nav>
      </div>
    </header>
    <main class="error-main shell" id="main-content">
      <p class="error-code" aria-hidden="true">404</p>
      <p class="eyebrow">
        <span data-lang-content="zh">路径没有对应页面</span>
        <span data-lang-content="en" lang="en" hidden
          >No page exists at this path</span
        >
      </p>
      <h1>
        <span data-lang-content="zh">这条路径到此为止。</span>
        <span data-lang-content="en" lang="en" hidden
          >This path ends here.</span
        >
      </h1>
      <p>
        <span data-lang-content="zh"
          >没有自动跳转，也不会猜测你想访问什么。请选择明确的下一步。</span
        >
        <span data-lang-content="en" lang="en" hidden
          >There is no automatic redirect and no guess about your intent. Choose
          an explicit next step.</span
        >
      </p>
      <div class="hero-actions">
        <a class="button button-primary" href="./index.html">
          <span data-lang-content="zh">返回首页</span>
          <span data-lang-content="en" lang="en" hidden>Return home</span>
          <span aria-hidden="true">↖</span>
        </a>
        <a
          class="button button-secondary"
          href="https://github.com/zhaowl94"
          rel="me noreferrer"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </div>
    </main>
    <p class="sr-only" id="language-status" aria-live="polite"></p>
  </body>
</html>
